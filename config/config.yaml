# LABPID -- value/structure PID. Run configuration.
#
# Documentation only: no code reads this file. Analyte identity lives in
# config/itemids.resolved.json + config/eicu_labnames.resolved.json, both
# regenerated at runtime by src/mimic_resolve_itemids.py / src/eicu_resolve_labnames.py.

source:
  project: labmae                          # billing / working project
  mimic:   physionet-data.mimiciv_3_1      # hosp.*, icu.*
  eicu:    physionet-data.eicu_crd
  workset_mimic: labmae.labpid             # cohort, labs_48h, paired_channels
  workset_eicu:  labmae.labpid_eicu        # separate dataset -- an eICU script can
                                           # never CREATE OR REPLACE over MIMIC's cohort

cohort:
  adults_min_age: 18
  stays: first_icu_stay_per_patient
  anchor: icu_intime                       # eICU is offset-native: unit admission = 0
  window_hours_before: 24                  # t0 - 24h
  window_hours_after: 24                   # t0 + 24h
  group_key: subject_id                    # never hadm_id (uniquepid on eICU)

channels:
  # First and last draw per (patient, analyte), selected by TIME alone -- never by
  # value. "The time of the worst result" is a fact about the value, so a min/max-by-
  # value rule would leak V into S and destroy the separation the whole design rests on.
  value:     [first_result, last_result]         # 12 analytes x 2 = 24 dims
  structure: [time_first, time_last]             # hours from t0; 24 dims
  time_sentinel: -999.0                          # unambiguously "never ordered"
  missingness_arms: [complete_case, impute_mean, impute_mice]
  headline_arm: complete_case

analytes:
  core_completeness_threshold: 0.95
  fluid: Blood
  exclude_derived: true                    # arithmetic functions of other analytes
  panel: matched_12                        # intersection of both databases' core sets
  matched_12: [BUN, Hct, Hgb, RBC, WBC, bicarbonate, chloride, creatinine,
               glucose, platelets, potassium, sodium]
  magnesium_dropped_from: MIMIC-IV         # eICU coverage 0.5836 would cost 46.1% of
                                           # its cohort and select a 1.47x
                                           # higher-mortality subpopulation

outcomes:
  - hospital_expire_flag                   # in-hospital mortality, unbounded by window
  - gender_female
  - age_ge65
  - race_binary                            # MIMIC: White vs Black/African American
                                           # eICU:  Caucasian vs African American
  # Race is a SPECIFICITY PROBE, not a prediction target -- no physiological pathway
  # connects draw timing to self-reported race. Sex and age are NOT negative controls:
  # both have genuine physiological links to lab values.

decomposition:
  k: 13                                    # atoms converge here and seed spread stops
                                           # narrowing; k=5 in the within-hospital arm,
                                           # forced by site sample size (max 3,803)
  grid: fixed_pre_collapse                 # collapse_for_occupancy NOT applied
  seeds: [0, 1, 2, 3, 4]
  primary_measure: broja                   # non-negative by construction
  sensitivity_measure: ccs                 # pointwise; negative atoms are definitional
  solver: cone                             # exponential cone (Makkeh et al. 2018)
  solver_cascade: [cone, admui, scipy]     # only on a non-negativity failure
  cross_check: gcmi                        # Gaussian-copula PID, zero tunable knobs
  units: nats

inference:
  significance_null: permute_outcome_against_fixed_joint_cells
  n_permutations: 1000
  calibration_null: permute_S_within_strata_of_V   # forces true u_str and syn to zero
  n_calibration_permutations: 200                  # per cell, 16 cells
  bootstrap_draws: 1000
  bootstrap_refits_codebook: true          # nests discretisation inside sampling, so
                                           # one interval covers both sources
